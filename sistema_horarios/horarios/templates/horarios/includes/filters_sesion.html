<div class="filter-wrap">
  <button type="button" class="btn btn-secondary filter-trigger" aria-expanded="false">
    Filtrar
    {% if active_filter_count %}<span class="filter-badge">{{ active_filter_count }}</span>{% endif %}
  </button>

  <div class="filter-float" aria-hidden="true" hidden>
    <div class="filter-float-backdrop"></div>
    <div class="filter-float-box">
      <div class="filter-float-title">Filtrar sesiones</div>
      <form method="get" class="filter-float-form">
        <div class="filter-field">
          <label for="filtro-q-ses">Asignatura</label>
          <input type="text" id="filtro-q-ses" name="q" class="form-control"
                 value="{{ request.GET.q|default:'' }}"
                 placeholder="Nombre o codigo de asignatura...">
        </div>
        <div class="filter-field">
          <label for="filtro-dia-ses">Dia</label>
          <select id="filtro-dia-ses" name="dia" class="form-control">
            <option value="">Todos</option>
            {% for val, label in dias_filtro %}
            <option value="{{ val }}" {% if request.GET.dia == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="filter-field">
          <label for="filtro-titulacion-ses">Titulacion</label>
          <select id="filtro-titulacion-ses" name="titulacion" class="form-control">
            <option value="">Todas</option>
            {% for t in titulaciones_filtro %}
            <option value="{{ t.id }}" {% if request.GET.titulacion == t.id|stringformat:"s" %}selected{% endif %}>
              {{ t.nombre }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="filter-float-footer">
          <button type="submit" class="btn btn-primary btn-sm">Aplicar</button>
          <a href="{{ request.path }}" class="btn btn-secondary btn-sm">Limpiar</a>
        </div>
      </form>
    </div>
  </div>
</div>
