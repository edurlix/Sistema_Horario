<div class="filter-wrap">
  <button type="button" class="btn btn-secondary filter-trigger" aria-expanded="false">
    Filtrar
    {% if active_filter_count %}<span class="filter-badge">{{ active_filter_count }}</span>{% endif %}
  </button>

  <div class="filter-float" aria-hidden="true" hidden>
    <div class="filter-float-backdrop"></div>
    <div class="filter-float-box">
      <div class="filter-float-title">Filtrar titulaciones</div>
      <form method="get" class="filter-float-form">
        <div class="filter-field">
          <label for="filtro-q-tit">Buscar</label>
          <input type="text" id="filtro-q-tit" name="q" class="form-control"
                 value="{{ request.GET.q|default:'' }}"
                 placeholder="Codigo o nombre...">
        </div>
        <div class="filter-float-footer">
          <button type="submit" class="btn btn-primary btn-sm">Aplicar</button>
          <a href="{{ request.path }}" class="btn btn-secondary btn-sm">Limpiar</a>
        </div>
      </form>
    </div>
  </div>
</div>
