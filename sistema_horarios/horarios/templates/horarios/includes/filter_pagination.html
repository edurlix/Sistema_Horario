{% if is_paginated %}
<div class="pagination">
  {% if page_obj.has_previous %}
    <a href="?{% if filter_qs %}{{ filter_qs }}&{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>
  {% endif %}
  <span>Pagina {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a href="?{% if filter_qs %}{{ filter_qs }}&{% endif %}page={{ page_obj.next_page_number }}">Siguiente</a>
  {% endif %}
</div>
{% endif %}
